<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dog Gallery</h1>
        <p>A collection of adorable dogs</p>
    </header>
    
    <main class="gallery">
        <div class="gallery-item">
            <img src="images/cocoa.jpg" alt="Cocoa">
            <h3>Cocoa</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/greyson.jpg" alt="Greyson">
            <h3>Greyson</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/jack_and_annie.jpg" alt="Jack and Annie">
            <h3>Jack and Annie</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/jellybean.jpg" alt="Jellybean">
            <h3>Jellybean</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/max.jpg" alt="Max">
            <h3>Max</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/rosco.jpg" alt="Rosco">
            <h3>Rosco</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/sam.jpg" alt="Sam">
            <h3>Sam</h3>
        </div>
        
        <div class="gallery-item">
            <img src="images/sheldon.jpg" alt="Sheldon">
            <h3>Sheldon</h3>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Dog Gallery</p>
    </footer>
</body>
</html>
